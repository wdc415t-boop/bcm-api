# Render.com Blueprint for BeachCombersMania API v2.0

services:
  - type: web
    name: bcm-api
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://marcomania.online,https://naplesmania.online,https://bonitamania.online,https://ftmyersmania.online,https://sanibelmania.online,https://captivamania.online,https://beachcombersmania.online,https://marcomainia.online
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "30"
      - key: JWT_EXPIRES_IN
        value: "30d"
      - key: DB_PATH
        value: "./data/bcm.db"
      # ── Phase 1 (2026-10-28) ──
      - key: BCM_MODEL
        value: claude-sonnet-5-5
      - key: BCM_CATALOG_URL
        value: https://beachcombersmania.online/assets/MASTER-SHELL-DB.json
      - key: BCM_DECIDER
        value: "off"            # set to typesafe/jev-1.14 after the eval passes
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BCM_EVAL_KEY
        sync: false
    healthCheckPath: /api/health
